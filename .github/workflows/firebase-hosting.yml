name: Deploy Ontools to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies & build
        run: npm install && npm run build

      - name: Deploy to Firebase Hosting (Ontools)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DASHBOARD_4AA16 }}
          channelId: live
          projectId: dashboard-4aa16
          target: ontools-4aa16